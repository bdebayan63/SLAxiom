<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Royal Violet Primary Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <!-- Warm Amber Core Accent -->
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Violet Glow -->
    <filter id="violetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Shell -->
  <path
    d="M60 10 L102 28 V62 C102 88 60 110 60 110 C60 110 18 88 18 62 V28 Z"
    fill="#FFFFFF"
    stroke="url(#shieldBorder)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Interior Shield Inset -->
  <path
    d="M60 18 L94 33 V60 C94 81 60 99 60 99 C60 99 26 81 26 60 V33 Z"
    fill="#F5F3FF"
    stroke="#DDD6FE"
    stroke-width="1.5"
  />

  <!-- Zero-Knowledge Circuit Traces -->
  <path
    d="M60 26 V90 M34 44 H86 M31 64 H89 M42 78 H78"
    stroke="#C4B5FD"
    stroke-width="1.5"
    stroke-dasharray="3 3"
  />

  <!-- Cryptographic Core Rings -->
  <circle cx="60" cy="56" r="18" fill="#FFFFFF" stroke="url(#shieldBorder)" stroke-width="2.5" filter="url(#violetGlow)" />
  <circle cx="60" cy="56" r="12" fill="#FAF5FF" stroke="url(#amberCore)" stroke-width="2" />

  <!-- ZK Keyhole / Verification Gateway -->
  <path
    d="M60 49 A4.5 4.5 0 0 0 55.5 53.5 C55.5 56 57.5 58 57.5 63 H62.5 C62.5 58 64.5 56 64.5 53.5 A4.5 4.5 0 0 0 60 49 Z"
    fill="url(#shieldBorder)"
  />

  <!-- Circuit Micro-Nodes -->
  <circle cx="34" cy="44" r="3" fill="#7C3AED" />
  <circle cx="86" cy="44" r="3" fill="#7C3AED" />
  <circle cx="31" cy="64" r="3" fill="#D97706" />
  <circle cx="89" cy="64" r="3" fill="#D97706" />
  <circle cx="42" cy="78" r="2.5" fill="#7C3AED" />
  <circle cx="78" cy="78" r="2.5" fill="#7C3AED" />
  <circle cx="60" cy="90" r="3.5" fill="url(#amberCore)" />
</svg>
