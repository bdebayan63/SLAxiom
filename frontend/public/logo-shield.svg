<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Outline -->
  <path
    d="M50 8 L85 24 V52 C85 74 50 92 50 92 C50 92 15 74 15 52 V24 Z"
    fill="#0f192e"
    stroke="url(#shieldGrad)"
    stroke-width="3"
  />
  <!-- Inner Circuit Grid Lines -->
  <path
    d="M50 20 V80 M28 35 H72 M25 55 H75 M35 70 H65"
    stroke="#1e3056"
    stroke-width="1.5"
    stroke-dasharray="2 2"
  />
  <!-- Glowing Cryptographic Core -->
  <circle cx="50" cy="48" r="14" fill="#070b14" stroke="url(#glowGrad)" stroke-width="2.5" filter="url(#glow)" />
  <!-- Keyhole / Proof Gateway -->
  <path
    d="M50 42 A4 4 0 0 0 46 46 C46 48.5 48 50 48 54 H52 C52 50 54 48.5 54 46 A4 4 0 0 0 50 42 Z"
    fill="#38bdf8"
  />
  <!-- Circuit Nodes -->
  <circle cx="28" cy="35" r="2.5" fill="#38bdf8" />
  <circle cx="72" cy="35" r="2.5" fill="#38bdf8" />
  <circle cx="25" cy="55" r="2.5" fill="#818cf8" />
  <circle cx="75" cy="55" r="2.5" fill="#818cf8" />
  <circle cx="50" cy="80" r="3" fill="#10b981" />
</svg>
