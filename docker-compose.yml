services:
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: midnight-proof-server
    ports:
      - "6300:6300"
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    command: midnight-proof-server -v
    deploy:
      resources:
        limits:
          memory: 12G
